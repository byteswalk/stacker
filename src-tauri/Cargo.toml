[package]
name = "stacker"
version = "0.3.4"
description = "Windows developer workstation manager for runtimes, AI work agents, Git identities, and developer disk space"
authors = ["Stacker"]
license = "MIT"
repository = "https://github.com/byteswalk/stacker"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "stacker_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
fern = "0.7"
tauri = { version = "2.11.2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
encoding_rs = "0.8"
rust-ini = "0.21"
quick-xml = "0.39.4"
tempfile = "3"
jwalk = "0.8"
notify = "8"
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10"
url = "2"
percent-encoding = "2"
regex = "1"
ureq = "2"
zip = "2"
flate2 = "1"
tiny_http = "0.12"
minisign-verify = "0.2.5"
argon2 = { version = "0.5", features = ["zeroize"] }
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.2"
ssh-key = { version = "0.6", default-features = false, features = ["alloc", "ecdsa", "ed25519", "rsa", "encryption", "getrandom"] }
base64ct = { version = "1", features = ["alloc"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
winapi = { version = "0.3", features = ["winuser", "fileapi", "shellapi", "synchapi", "processthreadsapi", "handleapi", "winbase", "dpapi", "wincrypt", "minwindef", "winnt", "errhandlingapi", "tlhelp32", "jobapi2"] }
if-addrs = "0.15"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_StationsAndDesktops"] }

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0

[profile.dev.build-override]
debug = 0
incremental = false

[profile.test]
debug = 1
incremental = false

[profile.test.package."*"]
debug = 0

[profile.test.build-override]
debug = 0
incremental = false

[dev-dependencies]
minisign = "0.9.1"
